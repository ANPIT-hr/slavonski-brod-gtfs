<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pregled prijedloga — SB prijevoz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #222; }
    header { position: sticky; top: 0; background: #1F4E79; color: #fff; padding: 10px 16px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 10; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header select, header input, header button { font-size: 13px; padding: 6px 8px; border-radius: 5px; border: none; }
    header button { background: #ffd24a; cursor: pointer; font-weight: 600; }
    #wrap { max-width: 860px; margin: 16px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
      margin-bottom: 14px; overflow: hidden; display: grid; grid-template-columns: 240px 1fr; }
    .card .map { height: 180px; }
    .card .body { padding: 12px 14px; }
    .card h2 { font-size: 15px; margin: 0 0 4px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px;
      border-radius: 4px; color: #fff; vertical-align: middle; }
    .b-new { background: #198754; } .b-move { background: #fd7e14; }
    .s-new { background: #0d6efd; } .s-applied { background: #198754; } .s-rejected { background: #999; }
    .meta { font-size: 12px; color: #666; line-height: 1.5; margin: 6px 0; }
    .meta code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .row button { font-size: 13px; padding: 7px 12px; border: 1px solid #ccc; border-radius: 6px;
      background: #fff; cursor: pointer; }
    .row .ok { border-color: #198754; color: #198754; }
    .row .no { border-color: #c00; color: #c00; }
    .empty, .err { text-align: center; color: #777; padding: 40px; }
    .err { color: #c00; }
    @media (max-width: 620px) { .card { grid-template-columns: 1fr; } .card .map { height: 200px; } }
  </style>
</head>
<body>
  <header>
    <h1>Prijedlozi stajališta</h1>
    <select id="filter">
      <option value="new">Novi (za pregled)</option>
      <option value="">Svi</option>
      <option value="applied">Primijenjeni</option>
      <option value="rejected">Odbijeni</option>
    </select>
    <button id="refresh">↻ Osvježi</button>
    <button id="logout" title="Zaboravi token">⨯</button>
  </header>
  <div id="wrap"><p class="empty">Učitavam…</p></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const wrap = document.getElementById("wrap");
    const filterSel = document.getElementById("filter");

    function getToken() {
      let t = sessionStorage.getItem("sb_review_token");
      if (!t) { t = prompt("Review token:") || ""; if (t) sessionStorage.setItem("sb_review_token", t); }
      return t;
    }
    function authHeaders() { return { "Authorization": "Bearer " + getToken() }; }

    async function load() {
      const token = getToken();
      if (!token) { wrap.innerHTML = '<p class="err">Token je potreban.</p>'; return; }
      wrap.innerHTML = '<p class="empty">Učitavam…</p>';
      try {
        const r = await fetch("/api/recommendations?status=" + encodeURIComponent(filterSel.value),
          { headers: authHeaders() });
        if (r.status === 401) { sessionStorage.removeItem("sb_review_token"); wrap.innerHTML = '<p class="err">Neispravan token. Ponovo učitaj stranicu.</p>'; return; }
        const j = await r.json();
        render(j.items || []);
      } catch (e) {
        wrap.innerHTML = '<p class="err">Greška pri dohvaćanju (je li backend/KV postavljen?).</p>';
      }
    }

    function fmtTs(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function stopsRow(it) {
      // stop_id,stop_name,stop_lat,stop_lon — paste-ready for stops.txt
      return `${it.stop_id || ""},${(it.name || "").replace(/,/g, ";")},${it.new.lat.toFixed(6)},${it.new.lon.toFixed(6)},`;
    }

    function render(items) {
      if (!items.length) { wrap.innerHTML = '<p class="empty">Nema prijedloga za ovaj filter.</p>'; return; }
      wrap.innerHTML = "";
      items.forEach((it, i) => {
        const card = document.createElement("div");
        card.className = "card";
        const mapId = "m" + i;
        card.innerHTML =
          `<div class="map" id="${mapId}"></div>` +
          `<div class="body">` +
          `<h2><span class="badge ${it.type === "new" ? "b-new" : "b-move"}">${it.type === "new" ? "NOVO" : "POMAK"}</span> ` +
          `${it.name || "(bez imena)"} <span class="badge s-${it.status}">${it.status}</span></h2>` +
          `<div class="meta">` +
          (it.stop_id ? `ID: <code>${it.stop_id}</code><br>` : "") +
          (it.line ? `Linija: <code>${it.line}</code><br>` : "") +
          (it.old ? `Staro: <code>${it.old.lat.toFixed(6)}, ${it.old.lon.toFixed(6)}</code><br>` : "") +
          `Novo: <code>${it.new.lat.toFixed(6)}, ${it.new.lon.toFixed(6)}</code>` +
          (it.accuracy_m != null ? ` · ±${Math.round(it.accuracy_m)} m` : "") + `<br>` +
          (it.note ? `Napomena: ${it.note}<br>` : "") +
          `<span style="color:#999">${fmtTs(it.server_ts)}</span>` +
          `</div>` +
          `<div class="row">` +
          `<button class="copy">⎘ stops.txt redak</button>` +
          `<button class="ok">✓ Primijenjeno</button>` +
          `<button class="no">✕ Odbij</button>` +
          `</div></div>`;
        wrap.appendChild(card);

        const m = L.map(mapId, { attributionControl: false, zoomControl: false });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(m);
        const pts = [];
        if (it.old) { L.circleMarker([it.old.lat, it.old.lon], { radius: 6, color: "#c00", fillColor: "#c00", fillOpacity: 0.5 }).addTo(m).bindTooltip("staro"); pts.push([it.old.lat, it.old.lon]); }
        L.circleMarker([it.new.lat, it.new.lon], { radius: 7, color: "#198754", fillColor: "#198754", fillOpacity: 0.7 }).addTo(m).bindTooltip("novo"); pts.push([it.new.lat, it.new.lon]);
        if (it.old) L.polyline(pts, { color: "#555", dashArray: "4,5" }).addTo(m);
        m.fitBounds(pts.length > 1 ? pts : [pts[0], pts[0]], { padding: [30, 30], maxZoom: 17 });
        if (pts.length === 1) m.setView(pts[0], 16);

        card.querySelector(".copy").onclick = (e) => {
          const row = stopsRow(it);
          (navigator.clipboard ? navigator.clipboard.writeText(row) : Promise.reject())
            .then(() => { e.target.textContent = "kopirano ✓"; }).catch(() => prompt("Kopiraj:", row));
        };
        card.querySelector(".ok").onclick = () => patch(it.id, "applied");
        card.querySelector(".no").onclick = () => patch(it.id, "rejected");
      });
    }

    async function patch(id, status) {
      try {
        const r = await fetch("/api/recommendations", {
          method: "PATCH",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({ id, status }),
        });
        if (r.ok) load(); else alert("Nije uspjelo (" + r.status + ").");
      } catch (e) { alert("Greška mreže."); }
    }

    document.getElementById("refresh").onclick = load;
    document.getElementById("logout").onclick = () => { sessionStorage.removeItem("sb_review_token"); load(); };
    filterSel.onchange = load;
    load();
  </script>
</body>
</html>
