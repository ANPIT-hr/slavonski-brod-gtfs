<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slavonski Brod — gradski prijevoz (3D / satelit)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesium { margin: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: system-ui, sans-serif; }
    #panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3);
      padding: 10px 12px; max-height: 85vh; overflow-y: auto; width: 230px;
    }
    #panel h2 { font-size: 14px; margin: 0 0 8px; }
    #panel .ctl { font-size: 12px; margin-bottom: 8px; }
    #panel label.line { display: flex; align-items: center; gap: 8px;
      font-size: 13px; padding: 3px 0; cursor: pointer; }
    #panel .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; }
    #panel .name { line-height: 1.15; }
    #panel .name small { color: #666; display: block; font-size: 11px; }
    a { color: #1F4E79; }
  </style>
</head>
<body>
  <div id="cesium"></div>
  <div id="panel">
    <h2>Linije <a href="index.html" style="float:right;font-weight:normal;font-size:11px">← 2D karta</a></h2>
    <div class="ctl">
      <button id="all">Sve</button>
      <button id="none">Nijedna</button>
    </div>
    <div id="lines"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
  <script src="data.js"></script>
  <script>
    const D = window.GTFS_DATA;

    // Disable every Ion-backed widget so the viewer never asks for an Ion token.
    const viewer = new Cesium.Viewer("cesium", {
      baseLayerPicker: false,
      geocoder: false,
      timeline: false,
      animation: false,
      sceneModePicker: true,
      homeButton: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      baseLayer: false, // we add imagery explicitly below
    });
    viewer.scene.globe.show = true;

    // Free Esri World Imagery — no API key needed.
    Cesium.ArcGisMapServerImageryProvider.fromUrl(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
    ).then((provider) => {
      viewer.imageryLayers.addImageryProvider(provider);
    });

    const stopById = {};
    D.stops.forEach((s) => (stopById[s.id] = s));

    // Each route+direction is a list of entities (one polyline + its stops) so it
    // can be shown/hidden as a unit.
    const groups = {};      // key -> [entity]
    const layerKeys = [];

    function setGroup(key, show) {
      (groups[key] || []).forEach((e) => (e.show = show));
    }

    D.lines.forEach((line) => {
      const meta = D.routes[line.route_id] || { color: "#666", short_name: line.route_id };
      const key = line.route_id + "|" + line.direction_id;
      const color = Cesium.Color.fromCssColorString(meta.color);
      const ents = [];

      // geometry is [[lat, lon], ...]; Cesium wants [lon, lat, lon, lat, ...].
      const flat = [];
      line.geometry.forEach((p) => flat.push(p[1], p[0]));
      ents.push(viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray(flat),
          width: 4,
          clampToGround: true,
          material: color.withAlpha(0.9),
        },
        name: `${meta.short_name} — ${line.headsign || meta.long_name}`,
      }));

      line.stop_ids.forEach((sid, i) => {
        const s = stopById[sid];
        if (!s) return;
        ents.push(viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat),
          point: {
            pixelSize: 9,
            color: color,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
          name: s.name,
          description:
            `<p>${s.desc || ""}</p>` +
            `<p>${meta.short_name} · stajalište ${i + 1}/${line.stop_ids.length}</p>` +
            `<p>${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}</p>`,
        }));
      });

      groups[key] = ents;
      layerKeys.push({ key, meta, line });
    });

    // Frame Slavonski Brod.
    viewer.zoomTo(viewer.entities);

    // Toggle panel (same pattern as the 2D map).
    const linesDiv = document.getElementById("lines");
    layerKeys.forEach(({ key, meta, line }) => {
      const label = document.createElement("label");
      label.className = "line";
      const dirTxt = D.lines.filter((l) => l.route_id === line.route_id).length > 1
        ? ` (${line.headsign || "smjer " + line.direction_id})` : "";
      label.innerHTML =
        `<input type="checkbox" checked data-key="${key}">` +
        `<span class="swatch" style="background:${meta.color}"></span>` +
        `<span class="name"><b>${meta.short_name}</b>${dirTxt}` +
        `<small>${meta.long_name}</small></span>`;
      label.querySelector("input").addEventListener("change", (e) =>
        setGroup(key, e.target.checked)
      );
      linesDiv.appendChild(label);
    });

    function setAll(on) {
      document.querySelectorAll("#lines input").forEach((cb) => {
        cb.checked = on;
        setGroup(cb.dataset.key, on);
      });
    }
    document.getElementById("all").onclick = () => setAll(true);
    document.getElementById("none").onclick = () => setAll(false);
  </script>
</body>
</html>
